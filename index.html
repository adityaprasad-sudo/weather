<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sick animated weather shi</title>
    <style>
       
        @import url('https://fonts.googleapis.com/css2?family=Gorditas:wght@400;700&display=swap');
          @import url('https://fonts.googleapis.com/css2?family=Concert+One&display=swap');
        .body { 
            font-family: "Gorditas", serif;
            font-weight: 400;
            font-style: normal;
            overflow: hidden;
            color: rgb(19, 18, 18);
            background-color: orangered;
        }

        .weather{
            font-family: "Gorditas", serif;
            font-weight: 400;
            font-style: normal;
          font-size: clamp(60px, 20vw, 80px);      
          color: #fffdd0;
          text-shadow: 0px 0px 2px 1px rgba(0, 0, 0, 1);
        }
        .location{
            font-family: "Gorditas", serif;
            font-weight: 400;
            font-size: 10px;
            font-style: normal;
            font-size: clamp(10px, 20vw, 30px);

            color: #fffdd0;
            text-shadow: 0px 0px 2px 1px rgba(0, 0, 0, 1);
        }
        .pan{
            width: 100vw;
            height: 100vh;
            position: absolute;
            
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgb(131, 131, 131, 0.4);
            box-shadow: 0px 0px 15px 12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: -1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .moon{
            display:flex;
            opacity: 0.7;
            background-image: url('./images/moon2.png');
            background-size: cover;
            width: 250px;
            height: 250px;
            position:absolute;
            top: 7%;
            z-index: -4;
            left: 90%;
            transform: translate(-50%, -50%);
            animation: rotate 10s linear infinite;
        }
        .sun{
            display: none;
            background-image: url('./images/sun.png');
            background-size: cover;
            width: 250px;
            height: 250px;
            position: absolute;
            top: 5%;
            z-index: -4;
            left: 90%;
            transform: translate(-50%, -50%);
            animation: rotate 10s linear infinite;
        }
        .cloudy{
            display: none;
            background-image: url('./images/cloudy.png');
            background-size: cover;
            width: 250px;
            height: 250px;
            position: absolute;
            top: 10%;
            opacity: 0.7;
            z-index: -4;
            left: 80%;
            transform: translate(-50%, -50%);
        }
        .rainy{
            display: none;
            background-image: url('./images/rain.gif');
            background-size: cover;
            width: 250px;
            height: 250px;
            position: absolute;
            opacity: 0.7;
            top: 14%;
            z-index: -4;
            left: 80%;
            transform: translate(-50%, -50%);
        }
        .gradient {
            display: flex;
    background: linear-gradient(311deg, #dc5f00, #f24d00, #f200008e);
    background-size: 400% 100%;
    
    -webkit-animation: anim 50s ease infinite;
    animation: anim 4s ease infinite;
}

@-webkit-keyframes anim {
    0%{background-position:0% 11%}
    50%{background-position:100% 90%}
    100%{background-position:0% 11%}
}
@keyframes anim {
    0%{background-position:0% 11%}
    50%{background-position:100% 90%}
    100%{background-position:0% 11%}
}
        @keyframes rotate{
            0%{
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100%{
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
       .status{
        font-size: calc(100vw / 20);
       }
       .air{
        font-family: "Concert One", sans-serif;
        font-weight: 400;
        color: #fffdd0;
        align-items: center;
        text-align: center;
        padding-top: 15px;
        padding-left: 10px;
        font-style: normal;
        opacity: 0.6;
        font-size: 30px;
       }
       .midsec{
        display: flex;
        flex-direction: column;
        text-align: left;
        width: 100%;
        padding-bottom: 20px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        background-color: #afafaf41;
       }
       .cunt{
        
        display: flex;
        justify-content: space-evenly;
        flex-wrap: wrap;
        gap: 15px;
        width: 100%;
        margin-top: 10px;
        padding: 0 10px;
        box-sizing: border-box
       }
       .blocks{

        display: flex;
        flex-direction: row;
        flex: 1;
        
        font-family: "Concert One", sans-serif;
        font-weight: 400;
        color: #fffdd0;
        font-style: normal;
        font-size: 20px;
        padding-top: 10px;
        justify-content: center;
        text-align: center;
        width: 100px;
        height: 90px;
        border-radius: 20px;
        opacity: 0.5;
        border: 1px solid #fffdd0;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        background-color: #afafaf41;
       }
       .locaicon{
        display: inline-block;
        background-image: url('./images/location.png');
        background-size: cover;
        width: 20px;
        height: 20px;
        
        
       }
       .sidepan{
        position: absolute;
        top: 40%;
        left: 80%;
        
       }
       .idk{
        position: absolute;
        top: 10%; 
        left: 10%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 45px;
        width: 85%;
        max-width: 450px;
        z-index: 5;
       }
    </style>
</head>
<body class="gradient">
    <div class = "pan">
       <div class="sun">
        </div>
        <div class="moon">
        </div>
        <div class="cloudy">
        </div>
        <div class="rainy">
        </div>
    </div>
    <div class="idk">
    <div class="location"><span class="locaicon"></span>Indore, India</div>
    <div class="weather" id = "weather">28<span>°C</span>
    <div class="status">cloudy</div>
    </div>
    <div class="midsec">
    <div class="air">AQI-30</div>
    <div class="cunt">
    <div class="blocks">Running<br>-------<br>Good</div>
    <div class="blocks" >Jogging<br>-------<br>Good</div>
    <div class="blocks" >Cycling<br>-------<br>Good</div>
    </div>
    </div>
    </div>
    <div class="sidepan">cloudy</div>
    <script>
        const apiurl = 'whttps://api.open-meteo.com/v1/forecast?latitude=22.7179&longitude=75.8333&daily=weather_code&hourly=temperature_2m,weather_code&current=temperature_2m,rain,is_day,weather_code&timezone=auto'
        const weathertxt = document.querySelector('.weather');
        const sun = document.querySelector('.sun');
        const cloudy = document.querySelector('.cloudy')
        const rainy = document.querySelector('.rainy');
        const moon = document.querySelector('.moon')
        const gradient = document.querySelector('.gradient')
        async function update(){
          const responce = await fetch(apiurl);
          const data = await responce.json();
          const day = data.current.is_day;
          const codes = data.current.weather_code;
          const temp = data.current.temperature_2m;
          const rain = (codes >= 51 && codes <= 67)
          if(rain){
            rainy.style.display = 'block';
            sun.style.display = 'none';
            cloudy.style.display = 'none';
            moon.style.display = 'none';
            gradient.style.backgroundImage = 'linear-gradient(311deg, #dc5f00, #f24d00, #f200008e)';
          }else if(day == 1){
            sun.style.display = 'block';
            cloudy.style.display = 'none';
            rainy.style.display = 'none';
            moon.style.display = 'none';
          }else if(day == 0){
            gradient.style.backgroundImage = 'linear-gradient(37deg, #2e2da9, #06c2d2, #d2b806)'
            sun.style.display = 'none';
            cloudy.style.display = 'none';
            rainy.style.display = 'none';
            moon.style.display = 'block';
          }
          weathertxt.innerHTML = `${temp}<span>°C</span>`;
          setTimeout(update, 9000000);

        }
        update()
    </script>
</body>
</html>
