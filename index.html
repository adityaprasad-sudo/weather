<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sick animated weather shi</title>
    <style>
       
        @import url('https://fonts.googleapis.com/css2?family=Gorditas:wght@400;700&display=swap');

        .body { 
            font-family: "Gorditas", serif;
            font-weight: 400;
            font-style: normal;
            overflow: hidden;
            color: rgb(19, 18, 18);
            background-color: orangered;
        }

        .weather{
          font-size: calc(100vw / 7);
          align-items: center;
          justify-content: center;
          color: #fffdd0;
          text-shadow: 0px 0px 2px 1px rgba(0, 0, 0, 1);
          position: absolute;
          top: 15%;
          left: 50%;
          transform: translate(-50%, -50%);
        }
        .pan{
            width: calc(100vw - 90px);
            height: calc(100vh - 80px);
            position: absolute;
            border-radius: 30px;
            border: 1px solid rgb(0, 0, 0);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgb(131, 131, 131, 0.4);
            box-shadow: 0px 0px 15px 12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: -1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .moon{
            display: none;
            opacity: 0.7;
            background-image: url('./images/moon2.png');
            background-size: cover;
            width: 250px;
            height: 250px;
            position:absolute;
            top: 7%;
            z-index: -4;
            left: 90%;
            transform: translate(-50%, -50%);
            animation: rotate 10s linear infinite;
        }
        .sun{
            display: none;
            background-image: url('./images/sun.png');
            background-size: cover;
            width: 250px;
            height: 250px;
            position: absolute;
            top: 5%;
            z-index: -4;
            left: 90%;
            transform: translate(-50%, -50%);
            animation: rotate 10s linear infinite;
        }
        .cloudy{
            display: none;
            background-image: url('./images/cloudy.png');
            background-size: cover;
            width: 250px;
            height: 250px;
            position: absolute;
            top: 10%;
            opacity: 0.7;
            z-index: -4;
            left: 80%;
            transform: translate(-50%, -50%);
        }
        .rainy{
            display: none;
            background-image: url('./images/rain.gif');
            background-size: cover;
            width: 250px;
            height: 250px;
            position: absolute;
            opacity: 0.7;
            top: 13%;
            z-index: -4;
            left: 80%;
            transform: translate(-50%, -50%);
        }
        @keyframes rotate{
            0%{
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100%{
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }
       
    </style>
</head>
<body class="body">
    <div class = "pan">
       <div class="sun">
        </div>
        <div class="moon">
        </div>
        <div class="cloudy">
        </div>
        <div class="rainy">
        </div>
    </div>

    <div class="weather">
        Weather
    </div>
    <script>
        
    </script>
</body>
</html>
